name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The harness is built and run on arm64 exclusively, so CI is arm64. An x86
  # runner would compile it but would not exercise anything this campaign cares
  # about.
  c:
    name: c harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7

      - name: Install BLAS for the link check
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev numactl

      - name: make roofline
        run: make roofline

      - name: roofline runs and reports a plausible number
        # Standing order 2: the FMA chain gets optimized away if you let it.
        # A green compile proves nothing here -- the binary has to emit a
        # number that sanity_check() did not abort on.
        run: |
          GBB_THREADS=2 OMP_NUM_THREADS=2 ./bin/gbb-roofline | tee roofline.ndjson
          python3 - <<'PY'
          import json, sys
          recs = [json.loads(l) for l in open("roofline.ndjson") if l.strip()]
          peak = next(r for r in recs if r["metric"] == "peak_fma")
          g = peak["gflops_f64"]
          print(f"single-core peak_fma f64 = {g:.2f} GFLOP/s")
          if not (0.1 < g < 200.0):
              sys.exit(f"implausible peak_fma: {g} GFLOP/s -- see standing order 2")
          bw = next(r for r in recs if r["metric"] == "bandwidth")
          print(f"triad = {bw['triad_gbs']:.2f} GB/s")
          PY

      - name: bench.c compiles and links against a real BLAS
        run: make openblas OPENBLAS_DIR=/usr VARIANT=ci-system

      - name: coreprobe compiles and links against a real BLAS
        run: make coreprobe OPENBLAS_DIR=/usr VARIANT=ci-system

      - name: the correctness checks catch a wrong answer
        # Every routine gained a corner check on 2026-08-20, closing a gap in which
        # 31723 of 42743 cells on the first P2 pass carried `verified: null` -- and
        # the nulls were concentrated in TRSM/TRMM/SYMM, the family the campaign's
        # likely finding lives in. A check that never fires is `return 1;` with extra
        # steps, which is the mistake this repo has already made once, so the fixture
        # breaks each result deliberately and requires the check to notice. It needs
        # a real BLAS to produce right answers to corrupt, which is why it lives in
        # this job and not in the shell one.
        run: bash tests/verify-corner-mutation.sh

      - name: OPENBLAS_CORETYPE forcing actually works
        # The whole hardware x kernel-set cross now rides on force_coretype()
        # being honoured on a DYNAMIC_ARCH build, and on us being able to detect
        # when it is not. Debian's libopenblas is DYNAMIC_ARCH on arm64, so this
        # is the real mechanism, not a mock. If this step ever fails, the
        # experiment design in build-libs.sh is invalid and not merely broken.
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          set -u
          UNFORCED=$(./bin/gbb-coreprobe-ci-system | cut -d'|' -f1)
          echo "unforced selection: $UNFORCED"
          test -n "$UNFORCED" || { echo "::error::coreprobe reported nothing"; exit 1; }
          FORCED=$(OPENBLAS_CORETYPE=ARMV8 ./bin/gbb-coreprobe-ci-system | cut -d'|' -f1)
          echo "forced ARMV8:      $FORCED"
          if [ "$FORCED" != "armv8" ]; then
            echo "::error::OPENBLAS_CORETYPE=ARMV8 gave '$FORCED', not 'armv8'."
            echo "The coretype axis cannot be trusted on this build; run-matrix.sh"
            echo "is expected to detect exactly this and refuse to label the arm."
            exit 1
          fi
          # And the negative case: a name force_coretype() does not know must be
          # ignored, not silently accepted. run-matrix.sh depends on being able
          # to see that happen.
          BOGUS=$(OPENBLAS_CORETYPE=NOTATARGET ./bin/gbb-coreprobe-ci-system | cut -d'|' -f1)
          echo "forced NOTATARGET: $BOGUS  (must not equal 'notatarget')"
          test "$BOGUS" != "notatarget"

      - name: harness build flags are unchanged
        # Standing order 6: the harness must not be the thing that differs
        # between arms.
        run: bash gates/check-build-flags.sh

  # Lint only, and its OWN job for the same reason python-format is: steps inside a
  # job are sequential, so a failing lint step skips every substantive step after it.
  # That is not hypothetical here either -- shellcheck failed on this job from b59ae7b,
  # and the four suites below it therefore did not run for the whole window. One of
  # them (arch-selected-assert.sh) was broken on ELF the entire time and CI could not
  # say so. Exactly the shape of the ruff-format/gate-p1 defect, one language over.
  shell-lint:
    name: shell lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ludeeus/action-shellcheck@master
        with:
          severity: warning

  shell:
    name: shell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: bash -n
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; fail=1; }
          done < <(find . -name '*.sh' -not -path './.git/*')
          exit $fail
      - name: run-matrix decision logic (stub suite)
        # The runner decides whether to spend instance-hours and what to call
        # each arm. A defect there yields a plausible wrong answer rather than a
        # failed run, so it is tested on every push, against stubs, on any arch.
        run: bash tests/run-matrix-stubs.sh
      - name: arch_selected is asserted, not reported
        # Runs even if an earlier suite failed -- see the shell-lint comment.
        if: ${{ !cancelled() }}
        # Standing order 8 rides on capture-env.sh refusing to proceed rather
        # than noting the problem in a file nobody reads.
        run: bash tests/arch-selected-assert.sh
      - name: the SVE probe can report yes
        # Runs even if an earlier suite failed -- see the shell-lint comment.
        if: ${{ !cancelled() }}
        # Standing order 8's quiet trigger is build-libs.sh's sve_kernels(), and it
        # shipped a whole P2 pass as a constant function returning "no": `nm |
        # grep -q` under `set -o pipefail` reports 141 when grep exits early, so
        # SVE being present made the probe say it was absent. decompose.py then
        # raised the campaign's most outweighing escalation on four healthy builds.
        # The suite runs under pipefail, because a bare `bash x.sh` does not
        # inherit it and the bug is invisible without it.
        run: bash tests/sve-probe-assert.sh

      - name: the payload refuses a pass before spending on it
        # Runs even if an earlier suite failed -- see the shell-lint comment.
        if: ${{ !cancelled() }}
        # workload.sh aborts a P3 pass with no ArmPL or no commit pin *before*
        # build-libs.sh, so the cost of a bad launch is minutes rather than hours.
        # The suite asserts the ordering, not just the exit code.
        run: bash tests/workload-preflight.sh

  # Semantics only: lint and compilability. Deliberately does NOT include
  # `ruff format --check` -- see python-format below for why the split exists.
  python:
    name: python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned for the same reason BLIS_REF is pinned: `pipx install ruff` is a
      # mutable ref, so the formatter's verdict on an unchanged tree can change
      # when ruff releases. A cosmetic tool bump must not be able to decide
      # whether this repo's gates run.
      - run: pipx install ruff==0.16.3
      - name: ruff check
        run: ruff check .
      - name: py_compile
        run: |
          while IFS= read -r f; do
            python -m py_compile "$f"
          done < <(find . -name '*.py' -not -path './.git/*')

  # Formatting is cosmetic and is therefore its own job, so that nothing which
  # depends on the analysis being *correct* depends on it being *pretty*.
  #
  # This is not hypothetical. `ruff format --check` failed from b59ae7b onwards
  # over three whitespace sites, and because gate-p1 declared `needs: [python]`,
  # the P1 calibration suite was SKIPPED on every push for the whole window in
  # which 42c6369 rewrote the reference-arm scope and the denominator input set
  # and 04f4732 retired the peak_fma cross-check. gate-p1 exists precisely to
  # catch analysis drift "before the drift is discovered by a dataset that cost
  # real instance-hours", and it was dark while P2 spent them. A gate that a
  # trailing comma can silently disable is not a gate.
  python-format:
    name: python format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pipx install ruff==0.16.3
      - name: ruff format --check
        run: ruff format --check .

  gate-p0:
    name: gate p0
    # p0's stated requirement is "CI green on a clean clone", so it does depend
    # on formatting. That is correct for P0 and wrong for P1.
    needs: [c, shell, shell-lint, python, python-format]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev
      - run: bash gates/p0.sh

  gate-p1:
    name: gate p1
    needs: [python]
    # No BLAS, no Graviton, no spend: the whole point of P1 is that the analysis
    # can be calibrated against data whose answer is known, on any machine. It
    # runs here on every push because the alternative is that synth.py drifts
    # away from bench.c between now and P2 and the drift is discovered by a
    # dataset that cost real instance-hours.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash gates/p1.sh
